# Lab 2.9c — 🔐 KASITLI OLARAK TEHLİKELİ: node'un kök dosya sistemini pod'a bağlar.
# Sadece eğitim cluster'ında kullanın. Gün 3 Lab 3.9'da Pod Security Admission ile engellenecek.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-escape
  namespace: hostpath-demo
spec:
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /          # node'un KÖK dosya sistemi
