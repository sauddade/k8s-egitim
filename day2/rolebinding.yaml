# Lab 2.10 — RoleBinding: pod-reader rolünü app-sa ServiceAccount'una bağla
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-sa-pod-reader
  namespace: rbac-demo
subjects:
- kind: ServiceAccount
  name: app-sa
  namespace: rbac-demo
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
