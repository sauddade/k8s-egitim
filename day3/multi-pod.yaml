# Lab 3.7 — Çok container'lı pod'da log inceleme
apiVersion: v1
kind: Pod
metadata:
  name: multi-container
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo app: $(date) log satiri; sleep 5; done"]
  - name: sidecar
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo sidecar: $(date) log satiri; sleep 3; done"]
